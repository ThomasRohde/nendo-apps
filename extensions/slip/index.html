<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slip</title>
  <link rel="stylesheet" href="slip.css">
</head>
<body>
  <div id="app" aria-busy="true">
    <nav id="rail" aria-label="Workspace pages">
      <div class="rail-head"><span class="mark" aria-hidden="true">S</span><div><strong>Slip</strong><small id="tally">Starting…</small></div></div>
      <button id="new-page" type="button" class="new-page">New page</button>
      <ul id="pages"></ul>
      <p class="keys" aria-label="Keys">
        <span><kbd>Ctrl</kbd>+<kbd>D</kbd> Do it</span>
        <span><kbd>Ctrl</kbd>+<kbd>P</kbd> Print it</span>
        <span><kbd>Ctrl</kbd>+<kbd>I</kbd> Inspect it</span>
        <span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> Browse it</span>
        <span><kbd>Ctrl</kbd>+<kbd>.</kbd> Stop</span>
        <span><kbd>Ctrl</kbd>+<kbd>S</kbd> Keep the page, accept a method</span>
      </p>
    </nav>
    <main id="main">
      <div id="notices"></div>
      <div id="own-toolbar" class="own-toolbar" hidden>
        <button type="button" data-command="doit">Do it</button>
        <button type="button" data-command="printit">Print it</button>
        <button type="button" data-command="inspectit">Inspect it</button>
        <button type="button" data-command="browseit">Browse it</button>
        <button type="button" data-command="stop">Stop</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Tools">
        <button id="tab-workspace" type="button" role="tab" aria-controls="workspace-pane">Workspace</button>
        <button id="tab-browser" type="button" role="tab" aria-controls="browser-pane">Browser</button>
      </div>
      <section id="workspace-pane" class="pane" role="tabpanel" aria-labelledby="tab-workspace">
      <header class="page-head">
        <input id="title" maxlength="120" aria-label="Page title" autocomplete="off" spellcheck="false">
        <span id="saved" class="saved" aria-live="polite"></span>
        <button id="delete-page" type="button" class="quiet">Delete page</button>
      </header>
      <textarea id="editor" spellcheck="false" autocomplete="off" aria-label="Workspace: Smalltalk to evaluate"></textarea>
      <div id="result" class="result" role="status" hidden></div>
      </section>
      <section id="browser-pane" class="pane" role="tabpanel" aria-labelledby="tab-browser" hidden>
        <div class="browser-lists">
          <div class="column"><h2 id="b-packages-label">Packages</h2><ul id="b-packages" class="list" role="listbox" aria-labelledby="b-packages-label" tabindex="0"></ul></div>
          <div class="column"><h2 id="b-classes-label">Classes</h2><ul id="b-classes" class="list" role="listbox" aria-labelledby="b-classes-label" tabindex="0"></ul>
            <div class="sides" role="group" aria-label="Side"><button id="b-instance" type="button" aria-pressed="true">Instance</button><button id="b-class" type="button" aria-pressed="false">Class</button></div></div>
          <div class="column"><h2 id="b-protocols-label">Protocols</h2><ul id="b-protocols" class="list" role="listbox" aria-labelledby="b-protocols-label" tabindex="0"></ul></div>
          <div class="column"><h2 id="b-methods-label">Methods</h2><ul id="b-methods" class="list" role="listbox" aria-labelledby="b-methods-label" tabindex="0"></ul></div>
        </div>
        <div class="browser-bar">
          <span id="b-what" class="what"></span>
          <button id="b-new-class" type="button" class="quiet">New class</button>
          <button id="b-comment" type="button" class="quiet" aria-pressed="false">Comment</button>
          <button id="b-new-method" type="button" class="quiet">New method</button>
          <button id="b-remove" type="button" class="quiet">Remove method</button>
          <button id="b-accept" type="button" class="accept">Accept</button>
        </div>
        <textarea id="b-code" spellcheck="false" autocomplete="off" aria-label="Code: a method, a class definition or a comment"></textarea>
        <p id="b-problem" class="b-problem" role="alert" hidden></p>
      </section>
      <section id="transcript-pane" aria-label="Transcript">
        <header><h2>Transcript</h2><button id="clear-transcript" type="button" class="quiet">Clear</button></header>
        <pre id="transcript" tabindex="0"></pre>
      </section>
    </main>
    <aside id="inspector" aria-label="Inspector" hidden>
      <header class="i-head">
        <button id="i-back" type="button" class="quiet" aria-label="Back to the object before">‹</button>
        <div class="i-title"><strong id="i-class"></strong><span id="i-print"></span></div>
        <button id="i-refresh" type="button" class="quiet">Refresh</button>
        <button id="i-close" type="button" class="quiet" aria-label="Close the inspector">✕</button>
      </header>
      <p id="i-path" class="i-path"></p>
      <ul id="i-fields" class="i-fields"></ul>
      <p id="i-more" class="i-more" hidden></p>
      <textarea id="i-eval" spellcheck="false" autocomplete="off" aria-label="Evaluate with self as the inspected object" placeholder="self is the inspected object. Ctrl+D, Ctrl+P, Ctrl+I"></textarea>
      <div id="i-result" class="result" role="status" hidden></div>
    </aside>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="/_nendo/api.js"></script>
  <script type="module" src="slip.mjs"></script>
</body>
</html>
